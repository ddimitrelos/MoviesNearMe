# Render.com blueprint — deploys the MovieNearMe FastAPI backend.
# In Render: New + -> Blueprint -> pick the MoviesNearMe repo. It reads this file.
services:
  - type: web
    name: movienearme
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
