name: android-ci

# Builds and tests the Android app on a clean cloud VM (fast, reliable — no more
# local emulator thrashing). Runs JVM unit tests and instrumented UI tests on an
# emulator, and uploads screenshots + logcat + test reports as artifacts.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run JVM unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests + capture a screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          disable-animations: true
          script: |
            chmod +x gradlew
            adb logcat -c || true
            # Launch the app first and grab a screenshot, so we always have one
            # even if the gated tests below fail.
            ./gradlew :app:installDebug
            adb shell pm grant com.movienearme android.permission.ACCESS_FINE_LOCATION || true
            adb emu geo fix 23.7348 37.9755 || true
            adb shell am start -n com.movienearme/.MainActivity || true
            sleep 25
            adb exec-out screencap -p > app-screenshot.png
            adb logcat -d > logcat.txt
            # Now the gated UI + unit-on-device tests.
            ./gradlew connectedDebugAndroidTest
      - name: Upload artifacts (screenshot, logcat, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-artifacts
          path: |
            android/app-screenshot.png
            android/logcat.txt
            android/app/build/reports/androidTests
